version: "3.9"

services:
  # ── PostgreSQL ────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-trialmind}
      POSTGRES_USER: ${POSTGRES_USER:-trialmind}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-trialmind_secret}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-trialmind}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Data Ingestion (one-shot) ─────────────────────────────────────────────
  ingestion:
    build:
      context: ./services/ingestion
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://trialmind:trialmind_secret@postgres:5432/trialmind}
    volumes:
      - ./database:/app/../../database
    depends_on:
      postgres:
        condition: service_healthy
    profiles:
      - ingest

  # ── ML Service ────────────────────────────────────────────────────────────
  ml:
    build:
      context: ./services/ml
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://trialmind:trialmind_secret@postgres:5432/trialmind}
      MODEL_VERSION: ${MODEL_VERSION:-v1}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_S3_BUCKET: ${AWS_S3_BUCKET:-}
    volumes:
      - ml_models:/app/models
    ports:
      - "8001:8001"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  # ── Model Training (one-shot) ─────────────────────────────────────────────
  train:
    build:
      context: ./services/ml
    command: python train.py
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://trialmind:trialmind_secret@postgres:5432/trialmind}
      MODEL_VERSION: ${MODEL_VERSION:-v1}
    volumes:
      - ml_models:/app/models
    depends_on:
      postgres:
        condition: service_healthy
    profiles:
      - train

  # ── Agent Service ─────────────────────────────────────────────────────────
  agent:
    build:
      context: ./services/agent
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://trialmind:trialmind_secret@postgres:5432/trialmind}
      ML_SERVICE_URL: http://ml:8001
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-llama-3.1-8b-instant}
    ports:
      - "8002:8002"
    depends_on:
      postgres:
        condition: service_healthy
      ml:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8002/health')"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  # ── API Gateway ───────────────────────────────────────────────────────────
  gateway:
    build:
      context: ./services/gateway
    environment:
      PORT: 3000
      ML_SERVICE_URL: http://ml:8001
      AGENT_SERVICE_URL: http://agent:8002
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      - "3000:3000"
    depends_on:
      ml:
        condition: service_healthy
      agent:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:3000/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))\""]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 15s

  # ── Frontend ──────────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
    ports:
      - "80:80"
    depends_on:
      gateway:
        condition: service_healthy

volumes:
  postgres_data:
  ml_models:
