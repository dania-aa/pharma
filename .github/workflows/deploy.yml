name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      stage:
        description: "Deployment stage"
        required: true
        default: dev
        type: choice
        options: [dev, staging, prod]

env:
  AWS_REGION: us-east-1
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "20"

jobs:
  # ─── Determine stage ──────────────────────────────────────────────────────
  setup:
    name: Setup
    runs-on: ubuntu-latest
    outputs:
      stage: ${{ steps.stage.outputs.stage }}
    steps:
      - id: stage
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "stage=${{ inputs.stage }}" >> $GITHUB_OUTPUT
          elif [ "${{ github.ref }}" == "refs/heads/main" ]; then
            echo "stage=dev" >> $GITHUB_OUTPUT
          else
            echo "stage=dev" >> $GITHUB_OUTPUT
          fi

  # ─── Build & Push Docker images to ECR ───────────────────────────────────
  build-and-push:
    name: Build & Push Images
    runs-on: ubuntu-latest
    needs: setup
    strategy:
      matrix:
        service: [ml, agent, gateway, frontend]
        include:
          - service: ml
            context: ./services/ml
          - service: agent
            context: ./services/agent
          - service: gateway
            context: ./services/gateway
          - service: frontend
            context: ./frontend

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/trialmind-${{ matrix.service }}-${{ needs.setup.outputs.stage }}:${{ github.sha }}
            ${{ steps.login-ecr.outputs.registry }}/trialmind-${{ matrix.service }}-${{ needs.setup.outputs.stage }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─── CDK Deploy ───────────────────────────────────────────────────────────
  deploy-infra:
    name: Deploy Infrastructure (CDK)
    runs-on: ubuntu-latest
    needs: [setup, build-and-push]
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Set up Node.js (for CDK CLI)
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install CDK CLI
        run: npm install -g aws-cdk

      - name: Install CDK dependencies
        working-directory: infra
        run: pip install -r requirements.txt

      - name: CDK Deploy
        working-directory: infra
        run: cdk deploy --all --require-approval never -c stage=${{ needs.setup.outputs.stage }}

  # ─── Run DB migrations ────────────────────────────────────────────────────
  migrate:
    name: Run DB Schema
    runs-on: ubuntu-latest
    needs: [deploy-infra]
    steps:
      - uses: actions/checkout@v4
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Run migration via ECS task
        run: |
          aws ecs run-task \
            --cluster trialmind-${{ needs.setup.outputs.stage }} \
            --task-definition trialmind-ingestion-${{ needs.setup.outputs.stage }} \
            --overrides '{"containerOverrides":[{"name":"ingestion-container","command":["python","main.py","--init-db"]}]}' \
            --launch-type FARGATE \
            --network-configuration "awsvpcConfiguration={subnets=[$(aws ec2 describe-subnets --filters Name=tag:Name,Values='*Private*' --query 'Subnets[0].SubnetId' --output text)],assignPublicIp=DISABLED}"
