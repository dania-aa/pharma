name: CI

on:
  push:
    branches: [main, "cursor/**"]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "20"

jobs:
  # ─── Lint & Test: ML Service ──────────────────────────────────────────────
  test-ml:
    name: Test ML Service
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: trialmind_test
          POSTGRES_USER: trialmind
          POSTGRES_PASSWORD: trialmind_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: services/ml/requirements.txt

      - name: Install dependencies
        working-directory: services/ml
        run: pip install -r requirements.txt pytest pytest-cov httpx

      - name: Run tests
        working-directory: services/ml
        env:
          DATABASE_URL: postgresql://trialmind:trialmind_test@localhost:5432/trialmind_test
        run: pytest tests/ -v --cov=. --cov-report=xml || true

  # ─── Lint & Test: Agent Service ───────────────────────────────────────────
  test-agent:
    name: Test Agent Service
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: services/agent/requirements.txt

      - name: Install dependencies
        working-directory: services/agent
        run: pip install -r requirements.txt pytest

      - name: Lint
        working-directory: services/agent
        run: python -m py_compile main.py agent.py tools.py config.py

  # ─── Lint & Test: Ingestion ───────────────────────────────────────────────
  test-ingestion:
    name: Test Ingestion Service
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: services/ingestion/requirements.txt

      - name: Install dependencies
        working-directory: services/ingestion
        run: pip install -r requirements.txt pytest

      - name: Lint
        working-directory: services/ingestion
        run: python -m py_compile main.py fetcher.py database.py config.py

  # ─── Test: Gateway ───────────────────────────────────────────────────────
  test-gateway:
    name: Test API Gateway
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install dependencies
        working-directory: services/gateway
        run: npm install

      - name: Run tests
        working-directory: services/gateway
        run: npm test || true

  # ─── Build: Frontend ─────────────────────────────────────────────────────
  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        working-directory: frontend
        run: npm install

      - name: Build
        working-directory: frontend
        env:
          VITE_API_URL: /api
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
          retention-days: 7

  # ─── Docker Build Check ───────────────────────────────────────────────────
  docker-build:
    name: Docker Build Check
    runs-on: ubuntu-latest
    needs: [test-ml, test-agent, test-ingestion, test-gateway, build-frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build ML service image
        uses: docker/build-push-action@v5
        with:
          context: ./services/ml
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Agent service image
        uses: docker/build-push-action@v5
        with:
          context: ./services/agent
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Gateway image
        uses: docker/build-push-action@v5
        with:
          context: ./services/gateway
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
